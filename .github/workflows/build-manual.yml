name: '🔨 Manual Build'

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - all
        default: 'macos-arm64'
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        required: false
        type: boolean
        default: true
      target_type:
        description: 'Windows target to build (nsis is fastest; all = use yml default targets for every platform)'
        required: false
        type: choice
        options:
          - nsis
          - portable
          - zip
          - all
        default: 'nsis'

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          PLATFORM="${{ inputs.platform }}"
          TARGET="${{ inputs.target_type }}"

          # When target_type=all, leave electron-builder's --win/--mac/--linux
          # flag bare so it falls back to the target list in electron-builder.yml.
          # Otherwise append the chosen target name (e.g. "nsis") so the build
          # produces ONLY that artifact — saves ~3-5 minutes per Windows build
          # by skipping the other targets (portable, zip).
          # Note: target_type is treated as a Windows target name. Mac/Linux
          # builds always use yml defaults (dmg/zip and deb respectively); the
          # extra suffix is harmless for them because electron-builder only
          # applies it to the matching --<platform> flag.
          if [ "$TARGET" = "all" ]; then
            WIN_TARGET=""
            MAC_TARGET=""
            LINUX_TARGET=""
          else
            WIN_TARGET=" $TARGET"
            MAC_TARGET=""
            LINUX_TARGET=""
          fi

          MACOS_ARM64="{\"platform\":\"macos-arm64\",\"os\":\"macos-14\",\"command\":\"node scripts/build-with-builder.js arm64 --mac${MAC_TARGET} --arm64\",\"artifact-name\":\"macos-build-arm64\",\"arch\":\"arm64\"}"
          MACOS_X64="{\"platform\":\"macos-x64\",\"os\":\"macos-14\",\"command\":\"node scripts/build-with-builder.js x64 --mac${MAC_TARGET} --x64\",\"artifact-name\":\"macos-build-x64\",\"arch\":\"x64\"}"
          WINDOWS_X64="{\"platform\":\"windows-x64\",\"os\":\"windows-2022\",\"command\":\"node scripts/build-with-builder.js x64 --win${WIN_TARGET} --x64\",\"artifact-name\":\"windows-build-x64\",\"arch\":\"x64\"}"
          WINDOWS_ARM64="{\"platform\":\"windows-arm64\",\"os\":\"windows-2022\",\"command\":\"node scripts/build-with-builder.js arm64 --win${WIN_TARGET} --arm64\",\"artifact-name\":\"windows-build-arm64\",\"arch\":\"arm64\"}"
          LINUX_X64="{\"platform\":\"linux-x64\",\"os\":\"ubuntu-latest\",\"command\":\"node scripts/build-with-builder.js x64 --linux${LINUX_TARGET} --x64\",\"artifact-name\":\"linux-build-x64\",\"arch\":\"x64\"}"
          LINUX_ARM64="{\"platform\":\"linux-arm64\",\"os\":\"ubuntu-latest\",\"command\":\"node scripts/build-with-builder.js arm64 --linux${LINUX_TARGET} --arm64\",\"artifact-name\":\"linux-build-arm64\",\"arch\":\"arm64\"}"

          if [ "$PLATFORM" = "all" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64,$MACOS_X64,$WINDOWS_X64,$WINDOWS_ARM64,$LINUX_X64,$LINUX_ARM64]}"
          elif [ "$PLATFORM" = "macos-arm64" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64]}"
          elif [ "$PLATFORM" = "macos-x64" ]; then
            MATRIX="{\"include\":[$MACOS_X64]}"
          elif [ "$PLATFORM" = "windows-x64" ]; then
            MATRIX="{\"include\":[$WINDOWS_X64]}"
          elif [ "$PLATFORM" = "windows-arm64" ]; then
            MATRIX="{\"include\":[$WINDOWS_ARM64]}"
          elif [ "$PLATFORM" = "linux-x64" ]; then
            MATRIX="{\"include\":[$LINUX_X64]}"
          elif [ "$PLATFORM" = "linux-arm64" ]; then
            MATRIX="{\"include\":[$LINUX_ARM64]}"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix for platform '$PLATFORM':"
          echo "$MATRIX" | python3 -m json.tool

  build-pipeline:
    needs: prepare-matrix
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      ref: ${{ inputs.branch }}
      skip_code_quality: ${{ inputs.skip_code_quality }}
      append_commit_hash: true
      upload_installers_only: true
    secrets: inherit
